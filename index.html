<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine's Day!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffebee;
            color: #d50000;
            text-align: center;
            padding: 50px;
            overflow-x: hidden;
        }
        h1 {
            font-size: 3em;
            animation: fadeInDown 1s ease-out;
        }
        .heart {
            color: #e91e63;
            font-size: 100px;
            animation: heartBeat 1.5s infinite;
            display: inline-block;
        }
        p {
            animation: fadeInUp 1s ease-out 0.3s both;
        }
        button {
            background-color: #d50000;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.5em;
            cursor: pointer;
            border-radius: 5px;
            animation: fadeInUp 1s ease-out 0.6s both;
            transition: all 0.3s ease;
        }
        button:hover {
            background-color: #c51162;
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(197, 17, 98, 0.4);
        }
        button:active {
            transform: scale(0.95);
        }
        #message {
            font-size: 1.5em;
            animation: slideInMessage 0.6s ease-out;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Floating hearts background animation */
        .floating-hearts {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: -1;
        }
        .float-heart {
            position: absolute;
            font-size: 2em;
            animation: float linear infinite;
            opacity: 0.6;
        }
        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes heartBeat {
            0%, 100% {
                transform: scale(1);
            }
            25% {
                transform: scale(1.3);
            }
            50% {
                transform: scale(1);
            }
        }
        @keyframes slideInMessage {
            from {
                opacity: 0;
                transform: scale(0.5) rotateY(90deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotateY(0deg);
            }
        }
        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="floating-hearts" id="heartsContainer"></div>
    <h1>Welcome to Our Valentine's Day Surprise!</h1>
    <div class="heart">❤️</div>
    <p>Click the button below to receive a sweet message!</p>
    <button onclick="displayMessage()">Get Your Message</button>
    <p id="message" style="font-size: 1.5em;"></p>
    <script>
        function displayMessage() {
            const messages = [
                'You are loved! 💖',
                'Happy Valentine\'s Day! 🌹',
                'Love is in the air! 🌈',
                'You make my heart smile! 😊'
            ];
            const randomIndex = Math.floor(Math.random() * messages.length);
            document.getElementById('message').innerText = messages[randomIndex];
        }
        // Create floating hearts animation
        function createFloatingHearts() {
            const container = document.getElementById('heartsContainer');
            const heartEmojis = ['❤️', '💖', '💕', '💗', '💝'];
            for (let i = 0; i < 10; i++) {
                const heart = document.createElement('div');
                heart.className = 'float-heart';
                heart.innerText = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDuration = (5 + Math.random() * 5) + 's';
                heart.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(heart);
            }
        }
        // Initialize floating hearts
        createFloatingHearts();
    </script>
</body>
</html>
