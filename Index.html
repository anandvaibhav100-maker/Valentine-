<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine 💗</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#ffdbe6;
  font-family: Arial, sans-serif;
}

.card{
  background:#fff;
  width:90%;
  max-width:360px;
  padding:24px;
  border-radius:18px;
  text-align:center;
  box-shadow:0 12px 28px rgba(0,0,0,.15);
}

h1{
  color:#ff4d6d;
  font-size:22px;
  line-height:1.4;
}

.area{
  position:relative;
  height:120px;
  margin-top:20px;
}

button{
  padding:12px 26px;
  font-size:16px;
  border:none;
  border-radius:30px;
  cursor:pointer;
}

#yes{
  background:#ff4d6d;
  color:white;
}

#no{
  background:#e6e6e6;
  position:absolute;
  left:50%;
  top:60px;
  transform:translateX(-50%);
}

.heart{
  position:fixed;
  bottom:-20px;
  font-size:22px;
  animation:float 3s linear forwards;
}

@keyframes float{
  to{ transform:translateY(-350px); opacity:0; }
}
</style>
</head>

<body>

<div class="card" id="card">
  <h1>Will you be my Valentine? 💗</h1>

  <div class="area" id="area">
    <button id="yes">Yes 💖</button>
    <button id="no">No 🙈</button>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const no = document.getElementById("no");
  const yes = document.getElementById("yes");
  const area = document.getElementById("area");
  const card = document.getElementById("card");

  function moveNo(){
    const maxX = area.clientWidth - no.offsetWidth;
    const maxY = area.clientHeight - no.offsetHeight;

    no.style.left = Math.random()*maxX + "px";
    no.style.top  = Math.random()*maxY + "px";
    no.style.transform = "none";
  }

  no.addEventListener("pointerdown", moveNo);

  yes.addEventListener("click", () => {
    card.innerHTML = `<h1>YAY!! 💞<br>I knew you'd say yes 💌</h1>`;

    for(let i=0;i<30;i++){
      const h=document.createElement("div");
      h.className="heart";
      h.innerHTML="💗";
      h.style.left=Math.random()*100+"vw";
      document.body.appendChild(h);
      setTimeout(()=>h.remove(),3000);
    }
  });

});
</script>

</body>
</html>
